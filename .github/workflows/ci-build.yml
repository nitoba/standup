name: CI Build Images

on:
  workflow_call:
    inputs:
      message_id:
        description: Discord message id for pipeline updates
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
      MESSAGE_ID: ${{ inputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect CI metadata
        id: ci-meta
        uses: ./.github/actions/ci-metadata
        with:
          branch: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Meta (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-api
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (api)
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: |
            service=standup-api
            ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: "Notify: API image built payload"
        id: notify-api-payload
        if: always() && env.MESSAGE_ID != ''
        continue-on-error: true
        run: |
          API_OUT="${{ steps.build-api.outcome }}"
          if [ "$API_OUT" = "success" ]; then
            API_IMG="✅  **standup-api** — built"
          else
            API_IMG="❌  **standup-api** — failed"
          fi

          payload=$(jq -n \
            --arg sha "${{ steps.ci-meta.outputs.short_sha }}" \
            --arg commit_url "${{ steps.ci-meta.outputs.commit_url }}" \
            --arg branch "${{ steps.ci-meta.outputs.branch }}" \
            --arg actor "${{ steps.ci-meta.outputs.actor }}" \
            --arg run_url "${{ steps.ci-meta.outputs.run_url }}" \
            --arg ts "${{ steps.ci-meta.outputs.timestamp }}" \
            --arg api_img "$API_IMG" \
            '{
              "embeds": [{
                "title": "Standup CI/CD Pipeline",
                "description": ("Build em andamento para [`" + $sha + "`](" + $commit_url + ") em `" + $branch + "`"),
                "color": 15105570,
                "fields": [
                  { "name": "Commit", "value": ("[`" + $sha + "`](" + $commit_url + ")"), "inline": true },
                  { "name": "Branch", "value": ("`" + $branch + "`"), "inline": true },
                  { "name": "Actor", "value": $actor, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Quality", "value": "✅ Passed", "inline": true },
                  { "name": "Build", "value": "⏳ Running...", "inline": true },
                  { "name": "Deploy", "value": "⏳ Pending", "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Images", "value": ($api_img + "\n⏳  **standup-bot** — building...\n⏳  **standup-worker** — pending\n⏳  **standup-migrate** — pending\n⏳  **standup-web** — pending"), "inline": false },
                  { "name": "Run", "value": ("[View workflow](" + $run_url + ")"), "inline": false }
                ],
                "footer": { "text": "Standup Bot CI/CD" },
                "timestamp": $ts
              }]
            }')

          {
            echo 'payload<<EOF'
            printf '%s\n' "$payload"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: "Send: API image built"
        if: always() && steps.notify-api-payload.outputs.payload != ''
        continue-on-error: true
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          message-id: ${{ inputs.message_id }}
          payload: ${{ steps.notify-api-payload.outputs.payload }}

      - name: Meta (discord-bot)
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-bot
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (discord-bot)
        id: build-bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/discord-bot/Dockerfile
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: |
            service=standup-bot
            ${{ steps.meta-bot.outputs.labels }}
          cache-from: type=gha,scope=discord-bot
          cache-to: type=gha,mode=max,scope=discord-bot

      - name: "Notify: Bot image built payload"
        id: notify-bot-payload
        if: always() && env.MESSAGE_ID != ''
        continue-on-error: true
        run: |
          API_OUT="${{ steps.build-api.outcome }}"
          BOT_OUT="${{ steps.build-bot.outcome }}"

          if [ "$API_OUT" = "success" ]; then API_IMG="✅  **standup-api** — built"
          else API_IMG="❌  **standup-api** — failed"; fi

          if [ "$BOT_OUT" = "success" ]; then BOT_IMG="✅  **standup-bot** — built"
          else BOT_IMG="❌  **standup-bot** — failed"; fi

          payload=$(jq -n \
            --arg sha "${{ steps.ci-meta.outputs.short_sha }}" \
            --arg commit_url "${{ steps.ci-meta.outputs.commit_url }}" \
            --arg branch "${{ steps.ci-meta.outputs.branch }}" \
            --arg actor "${{ steps.ci-meta.outputs.actor }}" \
            --arg run_url "${{ steps.ci-meta.outputs.run_url }}" \
            --arg ts "${{ steps.ci-meta.outputs.timestamp }}" \
            --arg api_img "$API_IMG" \
            --arg bot_img "$BOT_IMG" \
            '{
              "embeds": [{
                "title": "Standup CI/CD Pipeline",
                "description": ("Build em andamento para [`" + $sha + "`](" + $commit_url + ") em `" + $branch + "`"),
                "color": 15105570,
                "fields": [
                  { "name": "Commit", "value": ("[`" + $sha + "`](" + $commit_url + ")"), "inline": true },
                  { "name": "Branch", "value": ("`" + $branch + "`"), "inline": true },
                  { "name": "Actor", "value": $actor, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Quality", "value": "✅ Passed", "inline": true },
                  { "name": "Build", "value": "⏳ Running...", "inline": true },
                  { "name": "Deploy", "value": "⏳ Pending", "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Images", "value": ($api_img + "\n" + $bot_img + "\n⏳  **standup-worker** — building...\n⏳  **standup-migrate** — pending\n⏳  **standup-web** — pending"), "inline": false },
                  { "name": "Run", "value": ("[View workflow](" + $run_url + ")"), "inline": false }
                ],
                "footer": { "text": "Standup Bot CI/CD" },
                "timestamp": $ts
              }]
            }')

          {
            echo 'payload<<EOF'
            printf '%s\n' "$payload"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: "Send: Bot image built"
        if: always() && steps.notify-bot-payload.outputs.payload != ''
        continue-on-error: true
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          message-id: ${{ inputs.message_id }}
          payload: ${{ steps.notify-bot-payload.outputs.payload }}

      - name: Meta (worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-worker
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (worker)
        id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: |
            service=standup-worker
            ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: "Notify: Worker image built payload"
        id: notify-worker-payload
        if: always() && env.MESSAGE_ID != ''
        continue-on-error: true
        run: |
          API_OUT="${{ steps.build-api.outcome }}"
          BOT_OUT="${{ steps.build-bot.outcome }}"
          WORKER_OUT="${{ steps.build-worker.outcome }}"

          if [ "$API_OUT" = "success" ]; then API_IMG="✅  **standup-api** — built"
          else API_IMG="❌  **standup-api** — failed"; fi

          if [ "$BOT_OUT" = "success" ]; then BOT_IMG="✅  **standup-bot** — built"
          else BOT_IMG="❌  **standup-bot** — failed"; fi

          if [ "$WORKER_OUT" = "success" ]; then WORKER_IMG="✅  **standup-worker** — built"
          else WORKER_IMG="❌  **standup-worker** — failed"; fi

          payload=$(jq -n \
            --arg sha "${{ steps.ci-meta.outputs.short_sha }}" \
            --arg commit_url "${{ steps.ci-meta.outputs.commit_url }}" \
            --arg branch "${{ steps.ci-meta.outputs.branch }}" \
            --arg actor "${{ steps.ci-meta.outputs.actor }}" \
            --arg run_url "${{ steps.ci-meta.outputs.run_url }}" \
            --arg ts "${{ steps.ci-meta.outputs.timestamp }}" \
            --arg api_img "$API_IMG" \
            --arg bot_img "$BOT_IMG" \
            --arg worker_img "$WORKER_IMG" \
            '{
              "embeds": [{
                "title": "Standup CI/CD Pipeline",
                "description": ("Build em andamento para [`" + $sha + "`](" + $commit_url + ") em `" + $branch + "`"),
                "color": 15105570,
                "fields": [
                  { "name": "Commit", "value": ("[`" + $sha + "`](" + $commit_url + ")"), "inline": true },
                  { "name": "Branch", "value": ("`" + $branch + "`"), "inline": true },
                  { "name": "Actor", "value": $actor, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Quality", "value": "✅ Passed", "inline": true },
                  { "name": "Build", "value": "⏳ Running...", "inline": true },
                  { "name": "Deploy", "value": "⏳ Pending", "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Images", "value": ($api_img + "\n" + $bot_img + "\n" + $worker_img + "\n⏳  **standup-migrate** — building...\n⏳  **standup-web** — pending"), "inline": false },
                  { "name": "Run", "value": ("[View workflow](" + $run_url + ")"), "inline": false }
                ],
                "footer": { "text": "Standup Bot CI/CD" },
                "timestamp": $ts
              }]
            }')

          {
            echo 'payload<<EOF'
            printf '%s\n' "$payload"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: "Send: Worker image built"
        if: always() && steps.notify-worker-payload.outputs.payload != ''
        continue-on-error: true
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          message-id: ${{ inputs.message_id }}
          payload: ${{ steps.notify-worker-payload.outputs.payload }}

      - name: Meta (migrate)
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-migrate
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (migrate)
        id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: "Notify: Migrate image built payload"
        id: notify-migrate-payload
        if: always() && env.MESSAGE_ID != ''
        continue-on-error: true
        run: |
          API_OUT="${{ steps.build-api.outcome }}"
          BOT_OUT="${{ steps.build-bot.outcome }}"
          WORKER_OUT="${{ steps.build-worker.outcome }}"
          MIGRATE_OUT="${{ steps.build-migrate.outcome }}"

          if [ "$API_OUT" = "success" ]; then API_IMG="✅  **standup-api** — built"
          else API_IMG="❌  **standup-api** — failed"; fi

          if [ "$BOT_OUT" = "success" ]; then BOT_IMG="✅  **standup-bot** — built"
          else BOT_IMG="❌  **standup-bot** — failed"; fi

          if [ "$WORKER_OUT" = "success" ]; then WORKER_IMG="✅  **standup-worker** — built"
          else WORKER_IMG="❌  **standup-worker** — failed"; fi

          if [ "$MIGRATE_OUT" = "success" ]; then MIGRATE_IMG="✅  **standup-migrate** — built"
          else MIGRATE_IMG="❌  **standup-migrate** — failed"; fi

          payload=$(jq -n \
            --arg sha "${{ steps.ci-meta.outputs.short_sha }}" \
            --arg commit_url "${{ steps.ci-meta.outputs.commit_url }}" \
            --arg branch "${{ steps.ci-meta.outputs.branch }}" \
            --arg actor "${{ steps.ci-meta.outputs.actor }}" \
            --arg run_url "${{ steps.ci-meta.outputs.run_url }}" \
            --arg ts "${{ steps.ci-meta.outputs.timestamp }}" \
            --arg api_img "$API_IMG" \
            --arg bot_img "$BOT_IMG" \
            --arg worker_img "$WORKER_IMG" \
            --arg migrate_img "$MIGRATE_IMG" \
            '{
              "embeds": [{
                "title": "Standup CI/CD Pipeline",
                "description": ("Build em andamento para [`" + $sha + "`](" + $commit_url + ") em `" + $branch + "`"),
                "color": 15105570,
                "fields": [
                  { "name": "Commit", "value": ("[`" + $sha + "`](" + $commit_url + ")"), "inline": true },
                  { "name": "Branch", "value": ("`" + $branch + "`"), "inline": true },
                  { "name": "Actor", "value": $actor, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Quality", "value": "✅ Passed", "inline": true },
                  { "name": "Build", "value": "⏳ Running...", "inline": true },
                  { "name": "Deploy", "value": "⏳ Pending", "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Images", "value": ($api_img + "\n" + $bot_img + "\n" + $worker_img + "\n" + $migrate_img + "\n⏳  **standup-web** — building..."), "inline": false },
                  { "name": "Run", "value": ("[View workflow](" + $run_url + ")"), "inline": false }
                ],
                "footer": { "text": "Standup Bot CI/CD" },
                "timestamp": $ts
              }]
            }')

          {
            echo 'payload<<EOF'
            printf '%s\n' "$payload"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: "Send: Migrate image built"
        if: always() && steps.notify-migrate-payload.outputs.payload != ''
        continue-on-error: true
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          message-id: ${{ inputs.message_id }}
          payload: ${{ steps.notify-migrate-payload.outputs.payload }}

      - name: Meta (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-web
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (web)
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: |
            service=standup-web
            ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: "Notify: Build complete payload"
        id: notify-build-complete-payload
        if: always() && env.MESSAGE_ID != ''
        continue-on-error: true
        run: |
          API_OUT="${{ steps.build-api.outcome }}"
          BOT_OUT="${{ steps.build-bot.outcome }}"
          WORKER_OUT="${{ steps.build-worker.outcome }}"
          MIGRATE_OUT="${{ steps.build-migrate.outcome }}"
          WEB_OUT="${{ steps.build-web.outcome }}"

          if [ "$API_OUT" = "success" ]; then API_IMG="✅  **standup-api**"
          else API_IMG="❌  **standup-api** — failed"; fi

          if [ "$BOT_OUT" = "success" ]; then BOT_IMG="✅  **standup-bot**"
          else BOT_IMG="❌  **standup-bot** — failed"; fi

          if [ "$WORKER_OUT" = "success" ]; then WORKER_IMG="✅  **standup-worker**"
          else WORKER_IMG="❌  **standup-worker** — failed"; fi

          if [ "$MIGRATE_OUT" = "success" ]; then MIGRATE_IMG="✅  **standup-migrate**"
          else MIGRATE_IMG="❌  **standup-migrate** — failed"; fi

          if [ "$WEB_OUT" = "success" ]; then WEB_IMG="✅  **standup-web**"
          else WEB_IMG="❌  **standup-web** — failed"; fi

          ALL_BUILD_OK="true"
          for outcome in "$API_OUT" "$BOT_OUT" "$WORKER_OUT" "$MIGRATE_OUT" "$WEB_OUT"; do
            if [ "$outcome" != "success" ]; then ALL_BUILD_OK="false"; break; fi
          done

          if [ "$ALL_BUILD_OK" = "true" ]; then
            BUILD_SUMMARY="✅ 5 images"
            COLOR=15105570
            DESC="Build concluido. Deploy em andamento para [\`${{ steps.ci-meta.outputs.short_sha }}\`](${{ steps.ci-meta.outputs.commit_url }})"
            DEPLOY_STATUS="⏳ Running..."
          else
            BUILD_SUMMARY="❌ Failed"
            COLOR=15158332
            DESC="❌ Build falhou para [\`${{ steps.ci-meta.outputs.short_sha }}\`](${{ steps.ci-meta.outputs.commit_url }})"
            DEPLOY_STATUS="⏭️ Skipped"
          fi

          payload=$(jq -n \
            --arg sha "${{ steps.ci-meta.outputs.short_sha }}" \
            --arg commit_url "${{ steps.ci-meta.outputs.commit_url }}" \
            --arg branch "${{ steps.ci-meta.outputs.branch }}" \
            --arg actor "${{ steps.ci-meta.outputs.actor }}" \
            --arg run_url "${{ steps.ci-meta.outputs.run_url }}" \
            --arg ts "${{ steps.ci-meta.outputs.timestamp }}" \
            --arg desc "$DESC" \
            --argjson color "$COLOR" \
            --arg build_summary "$BUILD_SUMMARY" \
            --arg deploy_status "$DEPLOY_STATUS" \
            --arg api_img "$API_IMG" \
            --arg bot_img "$BOT_IMG" \
            --arg worker_img "$WORKER_IMG" \
            --arg migrate_img "$MIGRATE_IMG" \
            --arg web_img "$WEB_IMG" \
            '{
              "embeds": [{
                "title": "Standup CI/CD Pipeline",
                "description": $desc,
                "color": $color,
                "fields": [
                  { "name": "Commit", "value": ("[`" + $sha + "`](" + $commit_url + ")"), "inline": true },
                  { "name": "Branch", "value": ("`" + $branch + "`"), "inline": true },
                  { "name": "Actor", "value": $actor, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Quality", "value": "✅ Passed", "inline": true },
                  { "name": "Build", "value": $build_summary, "inline": true },
                  { "name": "Deploy", "value": $deploy_status, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Images", "value": ($api_img + "\n" + $bot_img + "\n" + $worker_img + "\n" + $migrate_img + "\n" + $web_img), "inline": false },
                  { "name": "Run", "value": ("[View workflow](" + $run_url + ")"), "inline": false }
                ],
                "footer": { "text": "Standup Bot CI/CD" },
                "timestamp": $ts
              }]
            }')

          {
            echo 'payload<<EOF'
            printf '%s\n' "$payload"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: "Send: Build complete"
        if: always() && steps.notify-build-complete-payload.outputs.payload != ''
        continue-on-error: true
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          message-id: ${{ inputs.message_id }}
          payload: ${{ steps.notify-build-complete-payload.outputs.payload }}
