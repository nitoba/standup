name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  build:
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Meta (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-api
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: |
            service=standup-api
            ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Meta (discord-bot)
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-bot
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (discord-bot)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/discord-bot/Dockerfile
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: |
            service=standup-bot
            ${{ steps.meta-bot.outputs.labels }}
          cache-from: type=gha,scope=discord-bot
          cache-to: type=gha,mode=max,scope=discord-bot

      - name: Meta (worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-worker
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: |
            service=standup-worker
            ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Meta (migrate)
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitoba/standup-migrate
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push (migrate)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_VERSION: ${{ github.sha }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GHCR_PAT }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
      AZURE_DEVOPS_ORG: ${{ secrets.AZURE_DEVOPS_ORG }}
      AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key

          # Fresh known_hosts — runner is ephemeral, no stale entries to worry about.
          # Scan the deploy host by hostname and IP so that both "host" and "host,ip"
          # formats are trusted (net-ssh/Kamal checks the combined format).
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          DEPLOY_IP="$(getent ahostsv4 "$DEPLOY_HOST" | awk '{print $1; exit}')"
          echo "Resolved deploy host: ${DEPLOY_HOST} → ${DEPLOY_IP}"

          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keyscan -H -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$DEPLOY_IP" ]; then
            ssh-keyscan -H -t ed25519 "$DEPLOY_IP" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          echo "Known hosts entries: $(wc -l < ~/.ssh/known_hosts)"

      - name: Check remote host
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            echo "user=$(whoami)"
            echo "host=$(hostname)"
            docker info >/dev/null
            test -d /opt/standup/data
            test -d /Users/nitoba/repos
          '

      - name: Install Kamal
        run: |
          sudo gem install kamal --no-document

      - name: Create Kamal secrets file
        run: |
          mkdir -p .kamal
          cat > .kamal/secrets-common <<'EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          DISCORD_BOT_TOKEN=$DISCORD_BOT_TOKEN
          DISCORD_CHANNEL_ID=$DISCORD_CHANNEL_ID
          DISCORD_USER_ID=$DISCORD_USER_ID
          AI_PROVIDER_API_KEY=$AI_PROVIDER_API_KEY
          AZURE_DEVOPS_ORG=$AZURE_DEVOPS_ORG
          AZURE_DEVOPS_PAT=$AZURE_DEVOPS_PAT
          INTERNAL_SECRET=$INTERNAL_SECRET
          EOF

      - name: Validate Kamal config (API)
        run: kamal config -c config/deploy.api.yml

      - name: Validate Kamal config (Bot)
        run: kamal config -c config/deploy.bot.yml

      - name: Validate Kamal config (Worker)
        run: kamal config -c config/deploy.worker.yml

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "set -e && \
             echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u nitoba --password-stdin && \
             docker pull ghcr.io/nitoba/standup-migrate:sha-${DEPLOY_VERSION} && \
             docker run --rm \
               -v /opt/standup/data:/app/data \
               -e DATABASE_URL=/app/data/standup.db \
               -e NODE_ENV=production \
               ghcr.io/nitoba/standup-migrate:sha-${DEPLOY_VERSION}"

      - name: Create SSH config for deploy
        run: |
          cat > ~/.ssh/config <<EOF
          Host *
            IdentityFile ~/.ssh/deploy_key
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy API
        run: |
          kamal deploy \
            -c config/deploy.api.yml \
            --skip-push \
            --version "sha-${DEPLOY_VERSION}" \
            --skip-hooks

      - name: Deploy Discord Bot
        run: |
          kamal deploy \
            -c config/deploy.bot.yml \
            --skip-push \
            --version "sha-${DEPLOY_VERSION}" \
            --skip-hooks

      - name: Deploy Worker
        run: |
          kamal deploy \
            -c config/deploy.worker.yml \
            --skip-push \
            --version "sha-${DEPLOY_VERSION}" \
            --skip-hooks

      - name: Cleanup Kamal secrets file
        if: always()
        run: |
          rm -f .kamal/secrets-common
