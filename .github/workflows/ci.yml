name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit

  deploy:
    needs: quality
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/ci-deploy.yml
    with:
      message_id: ${{ needs.quality.outputs.message_id }}
    secrets: inherit
