name: CI Quality

on:
  workflow_call:
    outputs:
      message_id:
        description: Discord message id for pipeline updates
        value: ${{ jobs.quality.outputs.message_id }}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      message_id: ${{ steps.notify-start.outputs.message_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect CI metadata
        id: ci-meta
        uses: ./.github/actions/ci-metadata
        with:
          branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: "1.3.9"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Notify: Pipeline started payload"
        id: notify-start-payload
        continue-on-error: true
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL not configured; skipping"
            exit 0
          fi

          payload=$(jq -n \
            --arg sha "${{ steps.ci-meta.outputs.short_sha }}" \
            --arg commit_url "${{ steps.ci-meta.outputs.commit_url }}" \
            --arg branch "${{ steps.ci-meta.outputs.branch }}" \
            --arg actor "${{ steps.ci-meta.outputs.actor }}" \
            --arg run_url "${{ steps.ci-meta.outputs.run_url }}" \
            --arg ts "${{ steps.ci-meta.outputs.timestamp }}" \
            '{
              "embeds": [{
                "title": "Standup CI/CD Pipeline",
                "description": ("Pipeline iniciado para [`" + $sha + "`](" + $commit_url + ") em `" + $branch + "`"),
                "color": 3447003,
                "fields": [
                  { "name": "Commit", "value": ("[`" + $sha + "`](" + $commit_url + ")"), "inline": true },
                  { "name": "Branch", "value": ("`" + $branch + "`"), "inline": true },
                  { "name": "Actor", "value": $actor, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Quality", "value": "⏳ Running...", "inline": true },
                  { "name": "Build", "value": "⏳ Pending", "inline": true },
                  { "name": "Deploy", "value": "⏳ Pending", "inline": true },
                  { "name": "Run", "value": ("[View workflow](" + $run_url + ")"), "inline": false }
                ],
                "footer": { "text": "Standup Bot CI/CD" },
                "timestamp": $ts
              }]
            }')

          {
            echo 'payload<<EOF'
            printf '%s\n' "$payload"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: "Send: Pipeline started"
        id: notify-start
        if: always() && steps.notify-start-payload.outputs.payload != ''
        continue-on-error: true
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          method: POST
          wait: "true"
          payload: ${{ steps.notify-start-payload.outputs.payload }}

      - name: Lint
        id: lint
        run: bun run lint

      - name: Typecheck
        id: typecheck
        run: bun run typecheck

      - name: Test
        id: test
        run: bun run test

      - name: "Notify: Quality result payload"
        id: notify-quality-payload
        if: always() && steps.notify-start.outputs.message_id
        continue-on-error: true
        run: |
          LINT_OUT="${{ steps.lint.outcome }}"
          TYPE_OUT="${{ steps.typecheck.outcome }}"
          TEST_OUT="${{ steps.test.outcome }}"

          if [ "$LINT_OUT" = "success" ]; then LINT_STATUS="✅ Passed"
          elif [ "$LINT_OUT" = "skipped" ]; then LINT_STATUS="⏭️ Skipped"
          else LINT_STATUS="❌ Failed"; fi

          if [ "$TYPE_OUT" = "success" ]; then TYPE_STATUS="✅ Passed"
          elif [ "$TYPE_OUT" = "skipped" ]; then TYPE_STATUS="⏭️ Skipped"
          else TYPE_STATUS="❌ Failed"; fi

          if [ "$TEST_OUT" = "success" ]; then TEST_STATUS="✅ Passed"
          elif [ "$TEST_OUT" = "skipped" ]; then TEST_STATUS="⏭️ Skipped"
          else TEST_STATUS="❌ Failed"; fi

          ALL_QUALITY_OK="true"
          for outcome in "$LINT_OUT" "$TYPE_OUT" "$TEST_OUT"; do
            if [ "$outcome" != "success" ]; then ALL_QUALITY_OK="false"; break; fi
          done

          IS_MAIN="${{ github.ref == 'refs/heads/main' }}"

          if [ "$ALL_QUALITY_OK" = "true" ]; then
            QUALITY_SUMMARY="✅ Passed"
            COLOR=3066993
            if [ "$IS_MAIN" = "true" ]; then
              DESC="Quality passou. Build em andamento para [\`${{ steps.ci-meta.outputs.short_sha }}\`](${{ steps.ci-meta.outputs.commit_url }})"
              BUILD_STATUS="⏳ Running..."
              DEPLOY_STATUS="⏳ Pending"
            else
              DESC="Quality passou para [\`${{ steps.ci-meta.outputs.short_sha }}\`](${{ steps.ci-meta.outputs.commit_url }}) em \`${{ steps.ci-meta.outputs.branch }}\`"
              BUILD_STATUS="⏭️ Skipped (not main)"
              DEPLOY_STATUS="⏭️ Skipped (not main)"
            fi
          else
            QUALITY_SUMMARY="❌ Failed"
            COLOR=15158332
            DESC="❌ Quality falhou para [\`${{ steps.ci-meta.outputs.short_sha }}\`](${{ steps.ci-meta.outputs.commit_url }}) em \`${{ steps.ci-meta.outputs.branch }}\`"
            BUILD_STATUS="⏭️ Skipped"
            DEPLOY_STATUS="⏭️ Skipped"
          fi

          payload=$(jq -n \
            --arg sha "${{ steps.ci-meta.outputs.short_sha }}" \
            --arg commit_url "${{ steps.ci-meta.outputs.commit_url }}" \
            --arg branch "${{ steps.ci-meta.outputs.branch }}" \
            --arg actor "${{ steps.ci-meta.outputs.actor }}" \
            --arg run_url "${{ steps.ci-meta.outputs.run_url }}" \
            --arg ts "${{ steps.ci-meta.outputs.timestamp }}" \
            --arg desc "$DESC" \
            --argjson color "$COLOR" \
            --arg lint_status "$LINT_STATUS" \
            --arg type_status "$TYPE_STATUS" \
            --arg test_status "$TEST_STATUS" \
            --arg quality_summary "$QUALITY_SUMMARY" \
            --arg build_status "$BUILD_STATUS" \
            --arg deploy_status "$DEPLOY_STATUS" \
            '{
              "embeds": [{
                "title": "Standup CI/CD Pipeline",
                "description": $desc,
                "color": $color,
                "fields": [
                  { "name": "Commit", "value": ("[`" + $sha + "`](" + $commit_url + ")"), "inline": true },
                  { "name": "Branch", "value": ("`" + $branch + "`"), "inline": true },
                  { "name": "Actor", "value": $actor, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Lint", "value": $lint_status, "inline": true },
                  { "name": "Typecheck", "value": $type_status, "inline": true },
                  { "name": "Tests", "value": $test_status, "inline": true },
                  { "name": "\u200b", "value": "\u200b", "inline": false },
                  { "name": "Quality", "value": $quality_summary, "inline": true },
                  { "name": "Build", "value": $build_status, "inline": true },
                  { "name": "Deploy", "value": $deploy_status, "inline": true },
                  { "name": "Run", "value": ("[View workflow](" + $run_url + ")"), "inline": false }
                ],
                "footer": { "text": "Standup Bot CI/CD" },
                "timestamp": $ts
              }]
            }')

          {
            echo 'payload<<EOF'
            printf '%s\n' "$payload"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: "Send: Quality result"
        if: always() && steps.notify-quality-payload.outputs.payload != ''
        continue-on-error: true
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          message-id: ${{ steps.notify-start.outputs.message_id }}
          payload: ${{ steps.notify-quality-payload.outputs.payload }}
