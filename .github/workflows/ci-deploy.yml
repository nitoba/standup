name: CI Deploy

on:
  workflow_call:
    inputs:
      message_id:
        description: Discord message id for pipeline updates
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DOKPLOY_API_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_API_DEPLOY_WEBHOOK }}
      DOKPLOY_WEB_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEB_DEPLOY_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key

          touch ~/.ssh/known_hosts

          # Retry ssh-keyscan with backoff — Tailscale routes may need time to propagate
          for i in 1 2 3 4; do
            if ssh-keyscan -H -t ed25519 "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>&1; then
              echo "ssh-keyscan succeeded on attempt $i"
              break
            fi
            if [ "$i" -lt 4 ]; then
              echo "ssh-keyscan attempt $i failed, retrying in $((i * 2))s..."
              sleep $((i * 2))
            else
              echo "ssh-keyscan failed after $i attempts — continuing with StrictHostKeyChecking accept-new"
            fi
          done

      - name: Create SSH config for deploy
        run: |
          cat > ~/.ssh/config <<EOF
          Host *
            IdentityFile ~/.ssh/deploy_key
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy with Dokploy webhooks
        run: |
          ssh "nitoba@${DEPLOY_HOST}" \
            DOKPLOY_API_DEPLOY_WEBHOOK="${DOKPLOY_API_DEPLOY_WEBHOOK}" \
            DOKPLOY_WEB_DEPLOY_WEBHOOK="${DOKPLOY_WEB_DEPLOY_WEBHOOK}" \
            DEPLOY_REF="${GITHUB_REF_NAME}" \
            DEPLOY_SHA="${GITHUB_SHA}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          dokploy_postgres_container() {
            docker ps --format '{{.Names}}' | grep '^dokploy-postgres\.1\.' | head -1
          }

          trigger_webhook() {
            local name="$1"
            local webhook_path="$2"

            echo "Triggering ${name} deployment webhook"
            curl --fail --show-error --silent \
              --request POST "http://127.0.0.1:3000${webhook_path}" \
              --header "content-type: application/json" \
              --header "x-github-event: push" \
              --data "{\"ref\":\"refs/heads/main\",\"head_commit\":{\"message\":\"Release ${DEPLOY_REF}\",\"id\":\"${DEPLOY_SHA}\"},\"commits\":[{\"modified\":[\".github/workflows/ci-deploy.yml\"]}]}"
          }

          wait_deployment() {
            local name="$1"
            local app_id="$2"

            echo "Waiting for ${name} deployment to finish"
            for _ in $(seq 1 120); do
              status=$(docker exec "$(dokploy_postgres_container)" \
                psql -U dokploy -d dokploy -At \
                -c "select status from deployment where \"applicationId\"='${app_id}' order by \"createdAt\" desc limit 1;")

              case "${status}" in
                done)
                  echo "${name} deployment completed"
                  return 0
                  ;;
                running|pending|queued|building|deploying|"")
                  sleep 5
                  ;;
                *)
                  echo "${name} deployment failed with status: ${status}" >&2
                  docker exec "$(dokploy_postgres_container)" \
                    psql -U dokploy -d dokploy -c \
                    "select \"deploymentId\", status, \"errorMessage\", \"logPath\" from deployment where \"applicationId\"='${app_id}' order by \"createdAt\" desc limit 1;" >&2
                  return 1
                  ;;
              esac
            done

            echo "Timed out waiting for ${name} deployment" >&2
            return 1
          }

          wait_health() {
            local name="$1"
            local host="$2"
            local path="$3"

            echo "Waiting for ${name} health"
            for _ in $(seq 1 60); do
              if curl --fail --show-error --silent --header "Host: ${host}" "http://127.0.0.1${path}" >/dev/null; then
                echo "${name} is healthy"
                return 0
              fi
              sleep 5
            done

            echo "${name} did not become healthy in time" >&2
            return 1
          }

          trigger_webhook "standup-api" "${DOKPLOY_API_DEPLOY_WEBHOOK}"
          wait_deployment "standup-api" "B8XzWxS01Qk54Z8pPqt3q"
          wait_health "standup-api" "api.nitodev.com.br" "/health"

          trigger_webhook "standup-web" "${DOKPLOY_WEB_DEPLOY_WEBHOOK}"
          wait_deployment "standup-web" "67aOyQ5LfN6q4kTavReTb"
          wait_health "standup-web" "standup.nitodev.com.br" "/"
          REMOTE

      - name: Verify public routes
        run: |
          curl --fail --show-error --silent https://api.nitodev.com.br/health >/dev/null
          curl --fail --show-error --silent https://standup.nitodev.com.br/ >/dev/null
