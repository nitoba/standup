# Kamal deploy config — standup-bot (Discord bot)
#
# Discord gateway + internal HTTP server for worker notifications.
# No public proxy — uses Docker network alias for internal traffic.
# The Discord bot connects outbound to Discord's gateway (no inbound public traffic needed).
#
# No published ports: other containers reach this service via the "standup-bot"
# network alias on the shared "kamal" Docker network. This avoids port conflicts
# during redeploys (Kamal renames but doesn't stop the old container before starting the new one).
#
# Usage:
#   kamal deploy -c config/deploy.bot.yml
#   kamal app logs -c config/deploy.bot.yml

service: standup-bot
image: nitoba/standup-bot

registry:
  server: ghcr.io
  username: nitoba
  password:
    - KAMAL_REGISTRY_PASSWORD

servers:
  web:
    hosts:
      - colima.tail2ee1d6.ts.net
    options:
      network-alias:
        - standup-bot

    proxy: false

builder:
  context: .
  dockerfile: apps/discord-bot/Dockerfile
  arch: arm64

readiness_delay: 10

ssh:
  user: nitoba
  keys:
    - ~/.ssh/deploy_key

volumes:
  - /opt/standup/data:/app/data

env:
  clear:
    NODE_ENV: production
    BOT_INTERNAL_PORT: "3334"
    DATABASE_URL: /app/data/standup.db
    API_BASE_URL: https://api.nitodev.com.br
    WORKER_INTERNAL_URL: http://standup-worker:3335
  secret:
    - DISCORD_BOT_TOKEN
    - DISCORD_CHANNEL_ID
    - DISCORD_USER_ID
    - INTERNAL_SECRET
