# Kamal deploy config — standup-worker
#
# Cron scheduler + standup job pipeline + internal HTTP trigger.
# No public proxy — port 3335 is published directly on the host for internal traffic only.
# The worker needs read-only access to git repositories on the host for commit collection.
#
# Usage:
#   kamal deploy -c config/deploy.worker.yml
#   kamal app logs -c config/deploy.worker.yml

service: standup-worker
image: ghcr.io/nitoba/standup-worker


registry:
  server: ghcr.io
  username: nitoba
  password:
    - KAMAL_REGISTRY_PASSWORD

servers:
  web:
    hosts:
      - colima.tail2ee1d6.ts.net
    options:
      publish:
        - "3335:3335"
    proxy: false

builder:
  context: .
  dockerfile: apps/worker/Dockerfile
  arch: arm64

readiness_delay: 10

ssh:
  user: nitoba
  keys:
    - ~/.ssh/deploy_key

volumes:
  # Shared SQLite data directory
  - /opt/standup/data:/app/data
  # Git repositories: bind-mounted read-only from host.
  # TODO: Adjust the host path to where your repos live on the MacBook.
  - /Users/nitoba/repos:/repos:ro

env:
  clear:
    NODE_ENV: production
    WORKER_INTERNAL_PORT: "3335"
    DATABASE_URL: /app/data/standup.db
    # Internal communication: bot publishes port 3334 directly on the host
    BOT_INTERNAL_URL: http://host.docker.internal:3334
    # Git collector config
    REPOS_BASE_PATH: /repos
    GIT_AUTHOR: bruno.alves@biosistemico.com.br
    GIT_SINCE_PERIOD: "16 hours ago"
    # Azure DevOps
    AZURE_DEVOPS_DEFAULT_PROJECT: AGROTRACE
    # Scheduler
    TIMEZONE: America/Sao_Paulo
    STANDUP_CRON: "30 17 * * 1-5"
    STANDUP_REMINDER_CRON: "20 17 * * 1-5"
    STANDUP_RECOVERY_CRON: "0 18 * * 1-5"
  secret:
    - DISCORD_BOT_TOKEN
    - DISCORD_CHANNEL_ID
    - DISCORD_USER_ID
    - ANTHROPIC_AUTH_TOKEN
    - AZURE_DEVOPS_ORG
    - AZURE_DEVOPS_PAT
    - INTERNAL_SECRET
