# Kamal deploy config — standup-worker
#
# Cron scheduler + standup job pipeline + internal HTTP trigger.
# No public proxy — uses Docker network alias for internal traffic.
# The worker needs read-only access to git repositories on the host for commit collection.
#
# No published ports: other containers reach this service via the "standup-worker"
# network alias on the shared "kamal" Docker network. This avoids port conflicts
# during redeploys (Kamal renames but doesn't stop the old container before starting the new one).
#
# Usage:
#   kamal deploy -c config/deploy.worker.yml
#   kamal app logs -c config/deploy.worker.yml

service: standup-worker
image: nitoba/standup-worker

registry:
  server: ghcr.io
  username: nitoba
  password:
    - KAMAL_REGISTRY_PASSWORD

servers:
  web:
    hosts:
      - colima.tail2ee1d6.ts.net
    options:
      network-alias:
        - standup-worker

    proxy: false

builder:
  context: .
  dockerfile: apps/worker/Dockerfile
  arch: arm64

readiness_delay: 10

ssh:
  user: nitoba
  keys:
    - ~/.ssh/deploy_key

volumes:
  - /opt/standup/data:/app/data
  - /Users/nitoba/repos:/repos:ro

env:
  clear:
    NODE_ENV: production
    WORKER_INTERNAL_PORT: "3335"
    DATABASE_URL: /app/data/standup.db
    REPOS_ROOT_PATH: /repos
    BOT_INTERNAL_URL: http://standup-bot:3334
    API_INTERNAL_URL: http://standup-api:3333
    AZURE_DEVOPS_DEFAULT_PROJECT: AGROTRACE
    # OpenTelemetry — Jaeger runs on the host; containers reach it via host.docker.internal.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
  secret:
    - AI_PROVIDER_API_KEY
    - AZURE_DEVOPS_ORG
    - AZURE_DEVOPS_PAT
    - INTERNAL_SECRET
