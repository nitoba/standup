# Kamal deploy config — standup-api
#
# Hono HTTP API: health checks, standup CRUD, manual triggers.
# This is the only service with a public-facing kamal-proxy (api.nitodev.com.br).
# Internal services (bot, worker) are reached via Docker network aliases on the "kamal" network.
#
# Usage:
#   kamal deploy -c config/deploy.api.yml
#   kamal app logs -c config/deploy.api.yml

service: standup-api
image: nitoba/standup-api

servers:
  web:
    - colima.tail2ee1d6.ts.net

registry:
  server: ghcr.io
  username: nitoba
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/api/Dockerfile
  arch: arm64

proxy:
  host: api.nitodev.com.br
  app_port: 3333
  forward_headers: true
  healthcheck:
    path: /health
    interval: 3

ssh:
  user: nitoba
  keys:
    - ~/.ssh/deploy_key

volumes:
  # Shared SQLite data directory — same path across all 3 services.
  # Create /opt/standup/data on the host before first deploy.
  - /opt/standup/data:/app/data

env:
  clear:
    NODE_ENV: production
    PORT: "3333"
    DATABASE_URL: /app/data/standup.db
    REPOS_ROOT_PATH: /repos
    BETTER_AUTH_URL: https://api.nitodev.com.br
    # Internal communication via Docker network aliases on the "kamal" network.
    WORKER_INTERNAL_URL: http://standup-worker:3335
    BOT_INTERNAL_URL: http://standup-bot:3334
    CORS_ORIGIN: https://app.nitodev.com.br
    # OpenTelemetry — Jaeger runs on the host; containers reach it via host.docker.internal.
    # Remove or leave empty to disable tracing (zero overhead when unset).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
  secret:
    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET
    - BETTER_AUTH_SECRET
    - INTERNAL_SECRET
