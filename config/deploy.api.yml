# Kamal deploy config — standup-api
#
# Monólito NestJS: HTTP, scheduler, gateway Discord, jobs e email.
# Este é o único backend público via kamal-proxy (api.nitodev.com.br).
#
# Usage:
#   kamal deploy -c config/deploy.api.yml
#   kamal app logs -c config/deploy.api.yml

service: standup-api
image: nitoba/standup-api

servers:
  web:
    hosts:
      - colima.tail2ee1d6.ts.net
    options:
      network-alias:
        - standup-api

volumes:
  - /Users/nitoba/repos:/repos

registry:
  server: ghcr.io
  username: nitoba
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/api/Dockerfile
  arch: arm64

proxy:
  host: api.nitodev.com.br
  app_port: 3333
  forward_headers: true
  healthcheck:
    path: /health
    interval: 3

ssh:
  user: nitoba
  keys:
    - ~/.ssh/deploy_key

env:
  clear:
    NODE_ENV: production
    PORT: "3333"
    REPOS_ROOT_PATH: /repos
    BETTER_AUTH_URL: https://api.nitodev.com.br
    APP_URL: https://standup.nitodev.com.br
    CORS_ORIGIN: https://standup.nitodev.com.br
    DISCORD_GATEWAY_ENABLED: "true"
    SCHEDULER_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
    DISCORD_AUTOMATION_URL: http://host.docker.internal:4000
    DISCORD_SEND_TIMEOUT_MS: "60000"
  secret:
    - DATABASE_URL
    - DATABASE_AUTH_TOKEN
    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET
    - BETTER_AUTH_SECRET
    - DISCORD_BOT_TOKEN
    - DISCORD_CHANNEL_ID
    - DISCORD_GUILD_ID
    - GOOGLE_GENERATIVE_AI_API_KEY
    - GROQ_API_KEY
    - OPENROUTER_API_KEY
    - LLM_PROVIDERS_CONFIG
    - AZURE_DEVOPS_ORG
    - AZURE_DEVOPS_PAT
    - AZURE_DEVOPS_DEFAULT_PROJECT
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_SECURE
    - SMTP_FROM
    - SMTP_USER
    - SMTP_PASS
    - DISCORD_AUTOMATION_CHANNEL_URL
    - DISCORD_AUTOMATION_WEBHOOK_SECRET
