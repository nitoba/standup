# Kamal deploy config — standup-api
#
# Hono HTTP API: health checks, standup CRUD, manual triggers.
# This is the only service with a public-facing kamal-proxy (api.nitoba.com.br).
# Port 3333 is also published on the host for internal container-to-container traffic.
#
# Usage:
#   kamal deploy -c config/deploy.api.yml
#   kamal app logs -c config/deploy.api.yml

service: standup-api
image: ghcr.io/nitoba/standup-api

servers:
  web:
    - nitoba-mac.tail2ee1d6.ts.net

registry:
  server: ghcr.io
  username: nitoba
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/api/Dockerfile
  arch: arm64

proxy:
  host: api.nitoba.com.br
  app_port: 3333
  forward_headers: true
  healthcheck:
    path: /health
    interval: 3

ssh:
  user: nitoba
  keys:
    - ~/.ssh/deploy_key

volumes:
  # Shared SQLite data directory — same path across all 3 services.
  # Create /opt/standup/data on the host before first deploy.
  - /opt/standup/data:/app/data

env:
  clear:
    NODE_ENV: production
    PORT: "3333"
    DATABASE_URL: /app/data/standup.db
    # Internal communication: bot and worker publish ports directly on the host.
    # From inside a Docker container, host.docker.internal resolves to the Docker host.
    BOT_INTERNAL_URL: http://host.docker.internal:3334
    WORKER_INTERNAL_URL: http://host.docker.internal:3335
  secret:
    - DISCORD_USER_ID
    - INTERNAL_SECRET
