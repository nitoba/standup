# Kamal deploy config — standup-api
#
# Monólito NestJS: HTTP, scheduler, gateway Discord, jobs e email.
# Este é o único backend público via kamal-proxy (api.nitodev.com.br).
#
# Usage:
#   kamal deploy -c config/deploy.api.yml
#   kamal app logs -c config/deploy.api.yml

service: standup-api
image: nitoba/standup-api

servers:
  web:
    hosts:
      - colima.tail2ee1d6.ts.net
    options:
      network-alias:
        - standup-api

registry:
  server: ghcr.io
  username: nitoba
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: .
  dockerfile: apps/api-new/Dockerfile
  arch: arm64

proxy:
  host: api.nitodev.com.br
  app_port: 3333
  forward_headers: true
  healthcheck:
    path: /health
    interval: 3

ssh:
  user: nitoba
  keys:
    - ~/.ssh/deploy_key

env:
  clear:
    NODE_ENV: production
    PORT: "3333"
    REPOS_ROOT_PATH: /repos
    BETTER_AUTH_URL: https://api.nitodev.com.br
    APP_URL: https://app.nitodev.com.br
    CORS_ORIGIN: https://app.nitodev.com.br
    DISCORD_GATEWAY_ENABLED: "true"
    SCHEDULER_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
  secret:
    - DATABASE_URL
    - DATABASE_AUTH_TOKEN
    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET
    - BETTER_AUTH_SECRET
    - DISCORD_BOT_TOKEN
    - DISCORD_CHANNEL_ID
    - DISCORD_GUILD_ID
    - AI_PROVIDER_API_KEY
    - AZURE_DEVOPS_ORG
    - AZURE_DEVOPS_PAT
    - AZURE_DEVOPS_DEFAULT_PROJECT
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_SECURE
    - SMTP_FROM
    - SMTP_USER
    - SMTP_PASS
