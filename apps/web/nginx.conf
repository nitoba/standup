# nginx config for Angular SPA + reverse proxy to API
#
# All API routes are proxied to the standup-api container via the Docker
# network. The Angular app uses same-origin requests (environment.apiBaseUrl = '').
#
# SPA fallback: any non-file request returns index.html for client-side routing.
#
# NOTE: proxy_pass uses a variable so nginx resolves the upstream DNS per-request
# instead of at startup. Without this, nginx fails to start when standup-api is
# not yet resolvable (e.g. during rolling deploys or first boot ordering).
#
# This file is used as a template: ${DNS_RESOLVER} is replaced at container
# startup with the actual nameserver from /etc/resolv.conf. This makes it
# portable across Docker (127.0.0.11) and Podman (aardvark-dns).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Server hardening ────────────────────────────────────────
    server_tokens off;
    sendfile on;
    etag on;

    # DNS resolver — injected at container startup from /etc/resolv.conf via
    # docker-entrypoint.sh. Works on Docker (127.0.0.11), Podman (aardvark-dns),
    # and any other container runtime.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Body size limit ──────────────────────────────────────────
    client_max_body_size 10m;

    # ── File cache (static asset performance) ────────────────────
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ── Nginx own healthcheck ────────────────────────────────────
    # Distinct from /health (API). Useful to distinguish "nginx is up" from
    # "API is up" when debugging container orchestration issues.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── index.html — never cache ────────────────────────────────
    # The SPA entry point references hashed asset filenames. If the browser
    # serves a stale index.html after a deploy, it will request old chunks
    # that no longer exist, breaking the app.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ── Static assets with long-lived cache ──────────────────────
    # Angular hashes filenames, so we can cache aggressively.
    # access_log off reduces noise for high-volume asset requests.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────
    # Any route that doesn't match a file or API route falls back
    # to index.html for Angular's client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
