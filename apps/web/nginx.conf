# nginx config for Angular SPA + reverse proxy to API
#
# All API routes are proxied to the standup-api container via the Docker
# network. The Angular app uses same-origin requests (environment.apiBaseUrl = '').
#
# SPA fallback: any non-file request returns index.html for client-side routing.
#
# NOTE: proxy_pass uses a variable so nginx resolves the upstream DNS per-request
# instead of at startup. Without this, nginx fails to start when standup-api is
# not yet resolvable (e.g. during rolling deploys or first boot ordering).
#
# This file is used as a template: ${DNS_RESOLVER} is replaced at container
# startup with the actual nameserver from /etc/resolv.conf. This makes it
# portable across Docker (127.0.0.11) and Podman (aardvark-dns).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver — injected at container startup from /etc/resolv.conf via
    # docker-entrypoint.sh. Works on Docker (127.0.0.11), Podman (aardvark-dns),
    # and any other container runtime.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── API reverse proxy ────────────────────────────────────────
    # Upstream stored in a variable so DNS is resolved per-request, not at
    # startup. This prevents nginx from refusing to start when standup-api is
    # temporarily unreachable (first deploy, rolling restart, etc.).
    set $api_upstream http://standup-api:3333;

    location /standups {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /settings {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /repos {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reminders {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ready {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Better Auth routes (login, session, callback, etc.)
    location /api/auth {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets with long-lived cache ──────────────────────
    # Angular hashes filenames, so we can cache aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────
    # Any route that doesn't match a file or API route falls back
    # to index.html for Angular's client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
