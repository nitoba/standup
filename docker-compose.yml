name: standup

services:
  # ---------------------------------------------------------------------------
  # migrate — runs Drizzle migrations once before any app starts.
  #
  # Assigned to the "migrate" profile so it is excluded from `compose up`
  # and never left as a stopped container cluttering `compose ps`.
  #
  # Deploy procedure:
  #   1. podman compose run --rm migrate   ← runs migrations and auto-removes
  #   2. podman compose up -d              ← starts api, discord-bot, worker
  # ---------------------------------------------------------------------------
  migrate:
    container_name: standup-migrate
    profiles:
      - migrate
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    volumes:
      - standup-data:/app/data
    env_file: .env
    environment:
      DATABASE_URL: /app/data/standup.db
    networks:
      - internal
    restart: "no"

  # ---------------------------------------------------------------------------
  # api — Hono HTTP API (health, standup CRUD, manual trigger)
  # ---------------------------------------------------------------------------
  api:
    container_name: standup-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - standup-data:/app/data
    env_file: .env
    environment:
      PORT: "3333"
      DATABASE_URL: /app/data/standup.db
      REPOS_ROOT_PATH: /repos
      WORKER_INTERNAL_URL: http://standup-worker:3335
    networks:
      - internal
    restart: unless-stopped
    # Note: healthcheck via CMD-SHELL is not possible in distroless (no shell).
    # Liveness is monitored via restart: unless-stopped + the /health endpoint
    # exposed on PORT (accessible from the host or a reverse proxy).

  # ---------------------------------------------------------------------------
  # discord-bot — Discord gateway + internal HTTP server for worker notifications
  # ---------------------------------------------------------------------------
  discord-bot:
    container_name: standup-discord-bot
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    volumes:
      - standup-data:/app/data
    env_file: .env
    environment:
      BOT_INTERNAL_PORT: "3334"
      DATABASE_URL: /app/data/standup.db
      REPOS_ROOT_PATH: /repos
      API_BASE_URL: http://standup-api:3333
      WORKER_INTERNAL_URL: http://standup-worker:3335
    networks:
      - internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # web — Angular SPA served via nginx + reverse proxy to API
  # ---------------------------------------------------------------------------
  web:
    container_name: standup-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-4200}:80"
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # worker — cron scheduler + standup job pipeline + internal HTTP trigger
  # ---------------------------------------------------------------------------
  worker:
    container_name: standup-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    volumes:
      - standup-data:/app/data
      # Git repositories: bind-mounted read-only from host.
      # HOST_REPOS_ROOT_PATH points to the host path; inside the container the runtime root is /repos.
      - ${HOST_REPOS_ROOT_PATH:-/home/nitoba/Documents/repos/ibs/repos}:/repos:ro
    env_file: .env
    environment:
      WORKER_INTERNAL_PORT: "3335"
      DATABASE_URL: /app/data/standup.db
      BOT_INTERNAL_URL: http://standup-discord-bot:3334
      REPOS_ROOT_PATH: /repos
    networks:
      - internal
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  # Shared persistent volume for SQLite database (WAL mode supports concurrent readers)
  standup-data:
    name: standup-data

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Isolated bridge network — services are not reachable from the host except
  # via the explicitly published port on `api`. The internal communication
  # (api → worker, worker → discord-bot) stays off the public interface.
  internal:
    name: standup-internal
    driver: bridge
