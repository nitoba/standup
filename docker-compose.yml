name: standup

services:
  # ---------------------------------------------------------------------------
  # migrate — runs Drizzle migrations once before any app starts.
  #
  # Assigned to the "migrate" profile so it is excluded from `compose up`
  # and never left as a stopped container cluttering `compose ps`.
  #
  # Deploy procedure:
  #   1. podman compose run --rm migrate   ← runs migrations and auto-removes
  #   2. podman compose up -d              ← starts api, discord-bot, worker
  # ---------------------------------------------------------------------------
  migrate:
    container_name: standup-migrate
    profiles:
      - migrate
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    volumes:
      - standup-data:/app/data
    env_file: .env.local
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/standup.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
    networks:
      - internal
    restart: "no"

  # ---------------------------------------------------------------------------
  # api — Hono HTTP API (health, standup CRUD, manual trigger)
  # ---------------------------------------------------------------------------
  api:
    container_name: standup-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - standup-data:/app/data
    env_file: .env.local
    environment:
      PORT: "3333"
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/standup.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      REPOS_ROOT_PATH: /repos
      WORKER_INTERNAL_URL: http://standup-worker:3335
      BOT_INTERNAL_URL: http://standup-discord-bot:3334
      OTEL_EXPORTER_OTLP_ENDPOINT: http://standup-jaeger:4318
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - jaeger
    # Note: healthcheck via CMD-SHELL is not possible in distroless (no shell).
    # Liveness is monitored via restart: unless-stopped + the /health endpoint
    # exposed on PORT (accessible from the host or a reverse proxy).

  # ---------------------------------------------------------------------------
  # discord-bot — Discord gateway + internal HTTP server for worker notifications
  # ---------------------------------------------------------------------------
  discord-bot:
    container_name: standup-discord-bot
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    volumes:
      - standup-data:/app/data
    env_file: .env.local
    environment:
      BOT_INTERNAL_PORT: "3334"
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/standup.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      REPOS_ROOT_PATH: /repos
      API_BASE_URL: http://standup-api:3333
      API_INTERNAL_URL: http://standup-api:3333
      WORKER_INTERNAL_URL: http://standup-worker:3335
      OTEL_EXPORTER_OTLP_ENDPOINT: http://standup-jaeger:4318
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - jaeger

  # ---------------------------------------------------------------------------
  # web — Angular SPA served via nginx + reverse proxy to API
  # ---------------------------------------------------------------------------
  web:
    container_name: standup-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-4200}:80"
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # jaeger — distributed tracing backend (OTLP receiver + UI)
  # ---------------------------------------------------------------------------
  jaeger:
    container_name: standup-jaeger
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # worker — cron scheduler + standup job pipeline + internal HTTP trigger
  # ---------------------------------------------------------------------------
  worker:
    container_name: standup-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    volumes:
      - standup-data:/app/data
      # Git repositories: bind-mounted read-only from host.
      # HOST_REPOS_ROOT_PATH points to the host path; inside the container the runtime root is /repos.
      - ${HOST_REPOS_ROOT_PATH:-/home/nitoba/Documents/repos/ibs/repos}:/repos:ro,z
    env_file: .env.local
    environment:
      WORKER_INTERNAL_PORT: "3335"
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/standup.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      BOT_INTERNAL_URL: http://standup-discord-bot:3334
      API_INTERNAL_URL: http://standup-api:3333
      REPOS_ROOT_PATH: /repos
      # Public URL of the web SPA — used in weekly digest email links.
      # Points to the host-exposed port so links work in a browser.
      APP_URL: http://localhost:4200
      # SMTP — apontando para o mailpit local (catch-all, aceita qualquer credencial).
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "Standup Bot <bruno.alves@biosistemico.com.br>"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://standup-jaeger:4318
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - jaeger
      - mailpit

  # ---------------------------------------------------------------------------
  # mailpit — local SMTP catch-all + web UI for email previews
  #
  # Accessible from:
  #   - Web UI: http://localhost:8025
  #   - SMTP (worker inside Docker): host=mailpit port=1025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit
    container_name: standup-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP (also reachable as 'mailpit:1025' inside the internal network)
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - internal
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  # Shared persistent volume for SQLite database (WAL mode supports concurrent readers)
  standup-data:
    name: standup-data

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Isolated bridge network — services are not reachable from the host except
  # via the explicitly published port on `api`. The internal communication
  # (api → worker, worker → discord-bot) stays off the public interface.
  internal:
    name: standup-internal
    driver: bridge
