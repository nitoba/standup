name: standup

services:
  # ---------------------------------------------------------------------------
  # api — NestJS monolith (HTTP, scheduler, Discord gateway, jobs, email)
  #
  # The entrypoint runs Drizzle migrations before starting the compiled binary,
  # so there is no dedicated "migrate" service anymore.
  # ---------------------------------------------------------------------------
  api:
    container_name: standup-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - standup-data:/app/data
      - ${HOST_REPOS_ROOT_PATH:-/home/nitoba/Documents/repos/ibs/repos}:/repos:ro,z
      - ${HOST_SSH_PATH:-~/.ssh}:/root/.ssh:ro
    env_file: .env.local
    environment:
      NODE_ENV: production
      PORT: "3333"
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/standup.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      REPOS_ROOT_PATH: /repos
      APP_URL: http://localhost:${WEB_PORT:-4200}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-4200}
      BETTER_AUTH_URL: http://localhost:${PORT:-3333}
      DISCORD_GATEWAY_ENABLED: ${DISCORD_GATEWAY_ENABLED:-true}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      MEETING_PLANNING_WEB_CYCLE_START_DATE: ${MEETING_PLANNING_WEB_CYCLE_START_DATE:-2026-04-22}
      MEETING_SPOTLIGHT_ROTATION_START_DATE: ${MEETING_SPOTLIGHT_ROTATION_START_DATE:-2026-04-29}
      MEETING_SPOTLIGHT_ROTATION_START_TEAM: ${MEETING_SPOTLIGHT_ROTATION_START_TEAM:-Web}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ${SMTP_FROM:-Standup Bot <standup@example.com>}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://standup-jaeger:4318
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - jaeger
      - mailpit

  # ---------------------------------------------------------------------------
  # web — Angular SPA served via nginx + reverse proxy to API
  # ---------------------------------------------------------------------------
  web:
    container_name: standup-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-4200}:80"
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # jaeger — distributed tracing backend (OTLP receiver + UI)
  # ---------------------------------------------------------------------------
  jaeger:
    container_name: standup-jaeger
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mailpit — local SMTP catch-all + web UI for email previews
  #
  # Accessible from:
  #   - Web UI: http://localhost:8025
  #   - SMTP (worker inside Docker): host=mailpit port=1025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit
    container_name: standup-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP (also reachable as 'mailpit:1025' inside the internal network)
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  # Shared persistent volume for SQLite database (WAL mode supports concurrent readers)
  standup-data:
    name: standup-data

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Isolated bridge network — services are not reachable from the host except
  # via the explicitly published ports on `api`, `web`, `jaeger` and `mailpit`.
  internal:
    name: standup-internal
    driver: bridge
